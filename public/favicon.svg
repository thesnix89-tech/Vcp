<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="coinG" cx="0.4" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#FFE99A"/>
      <stop offset="0.55" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#B58514"/>
    </radialGradient>
    <radialGradient id="charG" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5A2A0F"/>
      <stop offset="1" stop-color="#1A0A02"/>
    </radialGradient>
    <linearGradient id="fireG" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FFD25A"/>
      <stop offset="0.45" stop-color="#E07A3F"/>
      <stop offset="1" stop-color="#C96342"/>
    </linearGradient>
  </defs>
  <!-- Coin base -->
  <circle cx="28" cy="30" r="20" fill="url(#coinG)" stroke="#8C6014" stroke-width="1.2"/>
  <!-- Inner rim -->
  <circle cx="28" cy="30" r="16.5" fill="none" stroke="#D9A52A" stroke-width="0.8" opacity="0.7"/>
  <!-- Letter C -->
  <path d="M 36 22 A 9 9 0 1 0 36 38" fill="none" stroke="#3B2206" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Burned/charred bottom-right area eating into the coin -->
  <path d="M 48 30 A 20 20 0 0 1 28 50 Q 32 48 36 44 Q 40 41 43 36 Q 46 33 48 30 Z" fill="url(#charG)"/>
  <!-- Charred edge crumbs -->
  <circle cx="44" cy="44" r="1.6" fill="#1A0A02"/>
  <circle cx="40" cy="48" r="1.1" fill="#1A0A02"/>
  <circle cx="48" cy="38" r="1.1" fill="#1A0A02"/>
  <!-- Fire flames rising from burned area -->
  <path d="M 41 50
           Q 45 44 42 38
           Q 47 42 49 36
           Q 53 41 51 47
           Q 56 44 57 50
           Q 56 56 50 58
           Q 44 58 41 54
           Z"
        fill="url(#fireG)"/>
  <!-- Inner flame highlight -->
  <path d="M 45 52
           Q 47 48 46 44
           Q 49 47 50 43
           Q 52 48 51 52
           Q 49 55 46 55
           Z"
        fill="#FFD25A" opacity="0.85"/>
</svg>
