<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Volchay Crypto — Анализ криптовалют через Gemini</title>
    <meta name="description" content="Платформа для AI-анализа криптовалют на базе Google Gemini API. Технический и фундаментальный анализ, обучение, гайды и туториалы." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cryptomind:theme");
          var sysDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var blackout = t === "blackout";
          var dark = t === "dark" || blackout || ((!t || t === "system") && sysDark);
          if (dark) document.documentElement.classList.add("dark");
          if (blackout) document.documentElement.classList.add("blackout");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
